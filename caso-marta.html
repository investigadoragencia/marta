<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Atualizando seus dados — Investigador Agência</title>
  <style>
    :root {
      --bg: #060d0a;
      --accent: #00ff7f;
      --muted: #bfe8cf;
      --mono: 'Courier New', monospace;
    }
    html,body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #020403 0%, var(--bg) 100%);
      font-family: Inter, system-ui, sans-serif;
      color: var(--muted);
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      gap: 1.2rem;
    }
    .logo {
      font-family: var(--mono);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--accent);
    }
    p {
      color: #c5f0da;
      max-width: 480px;
      margin: 0 auto 1.5rem;
      line-height: 1.5;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.85rem;
      color: rgba(200,255,220,0.15);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Agência Investigador</div>
    <h1>Atualizando seus dados</h1>
    <p>Estamos processando as informações mais recentes da sua conta e preparando o ambiente. Este processo pode levar alguns instantes.</p>
    <div class="spinner" role="status" aria-label="Carregando"></div>
    <p style="font-size:0.9rem;color:rgba(255,255,255,0.5)">Por favor, aguarde...</p>
  </div>
  <footer>Agência Investigador © 2025</footer>

  <script>
    // Simula tempo de atualização e redireciona para a página principal
    setTimeout(function(){
      window.location.href = '/marta/caso-marta.html';
    }, 8000);
  </script>
</body>
</html>
