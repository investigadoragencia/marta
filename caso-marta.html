<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Acesso liberado — Agência Investigador</title>
  <style>
    :root {
      --bg: #040a07;
      --accent: #1e90ff; /* azul */
      --text: #d7e8ff;
      --mono: 'Courier New', monospace;
    }
    html,body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #020403 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      gap: 1.2rem;
    }
    .logo {
      font-family: var(--mono);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--accent);
    }
    p {
      color: #c5e0ff;
      max-width: 480px;
      margin: 0 auto 1.5rem;
      line-height: 1.5;
    }
    .success {
      font-size: 3rem;
      color: var(--accent);
      animation: pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.5; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    a.btn {
      display: inline-block;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(30,144,255,0.06), rgba(30,144,255,0.02));
      border: 1px solid rgba(30,144,255,0.12);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-top: 1rem;
    }
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.85rem;
      color: rgba(200,230,255,0.15);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Agência Investigador</div>
    <div class="success">✅</div>
    <h1>Acesso liberado com sucesso</h1>
    <p>Seus dados foram atualizados e o acesso foi restaurado. Em instantes, você será redirecionado para o painel principal do caso.</p>
    <p style="font-size:0.9rem;color:rgba(255,255,255,0.5)">Redirecionando...</p>
    <a href="/marta/caso-marta.html" class="btn" id="goNow">Ir agora</a>
  </div>
  <footer>Agência Investigador © 2025</footer>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('goNow');
    if (btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = '/marta/caso-marta.html';
      });
    }
  });

  // Redirecionamento automático
  setTimeout(function(){
    window.location.href = '/marta/caso-marta.html';
  }, 6000);
</script>

  <script>
    // Redireciona após 6 segundos automaticamente
    setTimeout(function(){
      window.location.href = '/marta/caso-marta.html';
    }, 6000);

    // Botão manual
    document.getElementById('goNow').addEventListener('click', function(e){
      e.preventDefault();
      window.location.href = '/marta/caso-marta.html';
    });
  </script>
</body>
</html>
